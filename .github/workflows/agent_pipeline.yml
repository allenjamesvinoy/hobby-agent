name: Autonomous Multi-Agent Coder

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      idea_title:
        description: 'Project / Feature Title'
        required: true
        default: 'CLI Pomodoro Timer'
      idea_body:
        description: 'Description and requirements'
        required: true
        default: 'A terminal-based 25-minute work and 5-minute break timer.'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build-and-review:
    # Trigger if issue has the 'idea' label, or if manually dispatched
    if: (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'idea')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r pipeline/requirements.txt

      - name: Extract Issue or Dispatch Variables
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          INPUT_TITLE: ${{ github.event.inputs.idea_title }}
          INPUT_BODY: ${{ github.event.inputs.idea_body }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - << 'EOF_EXTRACT'
          import os

          event = os.environ.get("EVENT_NAME", "")
          if event == "issues":
              title = os.environ.get("ISSUE_TITLE", "")
              body = os.environ.get("ISSUE_BODY", "")
              branch = f"idea-issue-{os.environ.get('ISSUE_NUM', '0')}"
          else:
              title = os.environ.get("INPUT_TITLE", "")
              body = os.environ.get("INPUT_BODY", "")
              branch = f"idea-manual-{os.environ.get('RUN_ID', '0')}"

          env_file = os.environ.get("GITHUB_ENV")
          if env_file:
              with open(env_file, "a", encoding="utf-8") as f:
                  f.write(f"BRANCH_NAME={branch}\n")
                  f.write("TITLE<<DELIM_TITLE\n" + title + "\nDELIM_TITLE\n")
                  f.write("BODY<<DELIM_BODY\n" + body + "\nDELIM_BODY\n")
          EOF_EXTRACT

      - name: Run Multi-Agent System (Coder & Reviewer)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IDEA_TITLE: ${{ env.TITLE }}
          IDEA_BODY: ${{ env.BODY }}
          PYTHONPATH: .
        run: |
          python pipeline/run_agents.py

      - name: Create Pull Request with Generated Feature
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: autonomous implementation for '${{ env.TITLE }}'"
          branch: ${{ env.BRANCH_NAME }}
          title: "🤖 [Agent PR] ${{ env.TITLE }}"
          body-path: pr_summary.md
          labels: automated-pr, ready-for-review

      - name: Comment on Issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Agents have completed your project!**\n\nThe code has been reviewed, formatted, and pushed to a new Pull Request for your review.`
            })
